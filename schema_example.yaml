tables: # all db tables come under here
  messages: # define table named messages
    columns: # columns of table "messages" come here
      message: # define column named message
        value: VarChar # value type of row message is VarChar(String)
      integervalue:
        value: NumberI # value type of row id is Integer number
      floatvalue:
        value: NumberF # value type of row rating is Floating point number
  images: # second table
    columns:
      id:
        value: Number
      image_link:
        value: VarChar

settings: # settings for the db application come here
  compartment:
    rows: 50 # Amount of rows per db compartment
  password: String # Database password
