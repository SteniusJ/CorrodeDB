tables: # all db tables come under here
  messages: # table 1
    rows: # rows of table "messages" come here
      id: # row 1 "id"
        value: NumberI # value type of row 1 Integer number
      message: # row 2 "message"
        value: VarChar
      time_posted: # row 3 "value"
        value: VarChar
  reactions: # table 2
    rows:
      id:
        value: NumberF # number with decimal point
      reaction:
        value: VarChar
  images: # table 3
    rows:
      id:
        value: Number
      image_link:
        value: VarChar

settings: # settings for the db application come here
  compartment:
    rows: 50 # Amount of rows per db compartment
  password: String # Database password
